# Lumen sur un vrai Windows (à la demande, onglet « Actions » du dépôt) : les tests,
# dont ceux propres à Windows (Media Foundation, manifeste de la voix, registre, nuages),
# puis l'installateur compilé par les outils de Microsoft, sans signature de mise à jour
# (la clé ne quitte jamais le Mac). La version publiée, elle, est compilée sur le Mac
# (scripts/build-windows.mjs).
name: Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Ninja ordonne correctement la compilation du générateur de shaders Vulkan.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Vulkan (l'IA sur la carte graphique) : en-têtes, glslc et SPIR-V du SDK officiel.
      # Sa bibliothèque vulkan-1.lib est remplacée par une bibliothèque vide, comme dans
      # scripts/build-windows.mjs : Lumen fournit lui-même les fonctions de Vulkan qu'il
      # appelle et n'ouvre vulkan-1.dll que si elle est là (src-tauri/src/vulkan.rs).
      - name: Vulkan
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = "C:\VulkanSDK\${env:VULKAN_VERSION}"
          [IO.File]::WriteAllText("$sdk\Lib\vulkan-1.lib", "!<arch>`n")
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\bin"

      - name: Dépendances
        run: npm ci

      - name: Outils de publication
        run: node --test scripts/release.test.mjs

      # Tauri vérifie ce binaire dès la compilation de l'app, même pour les tests.
      - name: Transcription
        run: node scripts/build-sidecar.mjs

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked --lib --release

      - name: Installateur
        shell: pwsh
        run: |
          $unsignedConfig = Join-Path $env:RUNNER_TEMP 'tauri-unsigned.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 $unsignedConfig
          npx tauri build --bundles nsis --config $unsignedConfig

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
